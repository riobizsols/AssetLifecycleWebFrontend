name: Playwright E2E

# Starts ALM backend + frontend on the runner, then runs e2e/ against localhost.
#
# Required GitHub Secrets (repo → Settings → Secrets and variables → Actions):
#   GH_PAT              – PAT with read access to AssetLifecycleBackend
#   E2E_DATABASE_URL    – Postgres URL reachable from GitHub-hosted runners
#   E2E_JWT_SECRET      – JWT secret used by backend
#   RIO_EMAIL           – test user email
#   RIO_PASSWORD        – test user password
# Optional secrets:
#   E2E_TENANT_DATABASE_URL  (defaults to E2E_DATABASE_URL)
#   E2E_GENERIC_URL          (defaults to E2E_DATABASE_URL)

on:
  workflow_dispatch:
  push:
    branches: [Niranjan-Prod, main, master]
    paths:
      - 'e2e/**'
      - 'playwright.config.js'
      - '.github/workflows/playwright.yml'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [Niranjan-Prod, main, master]
    paths:
      - 'e2e/**'
      - 'playwright.config.js'
      - '.github/workflows/playwright.yml'
      - 'src/**'

concurrency:
  group: playwright-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    timeout-minutes: 90
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: riobizsols/AssetLifecycleBackend
          ref: Niranjan-Prod
          token: ${{ secrets.GH_PAT }}
          path: backend

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Write backend .env
        working-directory: backend
        env:
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          E2E_TENANT_DATABASE_URL: ${{ secrets.E2E_TENANT_DATABASE_URL }}
          E2E_GENERIC_URL: ${{ secrets.E2E_GENERIC_URL }}
          E2E_JWT_SECRET: ${{ secrets.E2E_JWT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${E2E_DATABASE_URL}" ] || [ -z "${E2E_JWT_SECRET}" ]; then
            echo "Missing E2E_DATABASE_URL or E2E_JWT_SECRET secrets"
            exit 1
          fi
          TENANT_URL="${E2E_TENANT_DATABASE_URL:-$E2E_DATABASE_URL}"
          GENERIC_URL="${E2E_GENERIC_URL:-$E2E_DATABASE_URL}"
          {
            echo "NODE_ENV=development"
            echo "PORT=5001"
            echo "FRONTEND_URL=http://localhost:5173"
            echo "BACKEND_URL=http://localhost:5001"
            echo "API_BASE_URL=http://localhost:5001/api"
            echo "MAIN_DOMAIN=localhost"
            echo "DATABASE_URL=${E2E_DATABASE_URL}"
            echo "TENANT_DATABASE_URL=${TENANT_URL}"
            echo "GENERIC_URL=${GENERIC_URL}"
            echo "JWT_SECRET=${E2E_JWT_SECRET}"
            echo "CACHE_ENABLED=false"
            echo "DB_SSL=false"
          } > .env

      - name: Start backend
        working-directory: backend
        run: |
          nohup npm start > ../backend.log 2>&1 &
          echo $! > ../backend.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5001/ >/dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start"
          cat ../backend.log || true
          exit 1

      - name: Start frontend
        env:
          VITE_API_BASE_URL: http://localhost:5001/api
          VITE_FRONTEND_URL: http://localhost:5173
          VITE_API_PORT: '5001'
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > frontend.log 2>&1 &
          echo $! > frontend.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5173/ >/dev/null; then
              echo "Frontend is up"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend failed to start"
          cat frontend.log || true
          exit 1

      - name: Run Playwright tests
        env:
          CI: true
          BASE_URL: http://localhost:5173
          RIO_EMAIL: ${{ secrets.RIO_EMAIL }}
          RIO_PASSWORD: ${{ secrets.RIO_PASSWORD }}
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-logs
          path: |
            backend.log
            frontend.log
          retention-days: 7
