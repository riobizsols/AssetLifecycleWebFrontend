server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # SPA route /assets collides with Vite's default build folder /assets/.
    # Exact matches must serve index.html or reload returns nginx 403 (directory index forbidden).
    location = /assets {
        try_files /index.html =404;
    }
    location = /assets/ {
        try_files /index.html =404;
    }

    # Hashed Vite chunks (legacy builds under /assets/...)
    location ~* ^/assets/.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|map)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Hashed Vite chunks (current builds under /static/...)
    location ~* ^/static/.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|map)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        # Do not use $uri/ — real directories must not win over SPA routes.
        try_files $uri /index.html;
    }
}
