server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # React route /assets collides with Vite's build folder /assets/.
    # Without these exact matches, nginx redirects /assets → /assets/ and
    # then returns 403 (directory listing disabled, no index in that folder).
    location = /assets {
        try_files /index.html =404;
    }
    location = /assets/ {
        try_files /index.html =404;
    }

    # Nested SPA paths like /assets/add (no file extension) → index.html
    location ~ ^/assets/[^./]+(/.*)?$ {
        try_files /index.html =404;
    }

    # Vite hashed bundles: /assets/index-abc123.js, etc.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Do not use $uri/ — that triggers trailing-slash redirects onto real dirs.
    location / {
        try_files $uri /index.html;
    }
}
